<ion-content class="auth-content" [fullscreen]="true">
  <main class="auth-layout"><section class="auth-card confirm-card" aria-labelledby="confirm-title">
    <a class="brand" routerLink="/auth/login" aria-label="WayFinder, inicio"><img src="assets/brand/W.png" alt="" width="48" height="48" /><span>WAYFINDER</span></a>
    <div class="auth-symbol" aria-hidden="true"><ion-icon name="checkmark-circle-outline"></ion-icon></div>
    <p class="eyebrow">Confirmación de cuenta</p>
    <h1 id="confirm-title">Confirma tu correo</h1>
    <p class="intro">El callback visual está preparado. La validación de enlaces se añadirá junto con el nuevo sistema de autenticación.</p>
    <p class="form-notice pending" role="status">No se está validando ningún enlace en esta versión.</p>
    <ion-button class="submit-button" expand="block" routerLink="/auth/login">Ir al inicio de sesión</ion-button>
  </section></main>
</ion-content>
