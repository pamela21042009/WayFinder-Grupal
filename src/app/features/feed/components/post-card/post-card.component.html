<article class="case-card">
  <header class="post-header">
    <div class="author-avatar" aria-hidden="true">{{ post.authorInitials }}</div>
    <div class="post-author">
      <strong>{{ post.author }}</strong>
      <span>{{ post.published }} <span aria-hidden="true">·</span> <ion-icon name="globe-outline" aria-label="Público"></ion-icon></span>
    </div>
    <button class="icon-action post-menu" type="button" [attr.aria-label]="'Más opciones para la publicación de ' + post.subject" (click)="menuRequested.emit(post)">
      <ion-icon name="ellipsis-horizontal" aria-hidden="true"></ion-icon>
    </button>
  </header>

  <div class="case-content">
    <div class="case-image-wrap">
      <img class="case-image" [src]="post.image" [alt]="'Fotografía de ' + post.subject" loading="lazy" />
    </div>
    <div class="case-details">
      <h2>{{ post.subject }}</h2>
      <ul class="case-meta">
        <li><ion-icon name="location-outline" aria-hidden="true"></ion-icon><span>Última referencia pública: {{ post.city }}</span></li>
        <li><ion-icon name="calendar-outline" aria-hidden="true"></ion-icon><span>Reportado: {{ post.reported }}</span></li>
      </ul>
      <p class="case-description">{{ post.description }}</p>
    </div>
  </div>

  <div class="case-actions" aria-label="Interacciones de la publicación">
    <button type="button" [class.liked]="post.liked" [attr.aria-pressed]="post.liked" [attr.aria-label]="post.liked ? 'Quitar reacción' : 'Reaccionar'" (click)="reactionToggled.emit(post)">
      <ion-icon [name]="post.liked ? 'heart' : 'heart-outline'" aria-hidden="true"></ion-icon><span>{{ formatCount(post.likes, post.liked) }}</span>
    </button>
    <button type="button" [attr.aria-label]="'Ver ' + post.comments + ' comentarios'" (click)="commentsRequested.emit(post)">
      <ion-icon name="chatbubble-outline" aria-hidden="true"></ion-icon><span>{{ post.comments }}</span>
    </button>
    <button class="share-action" type="button" aria-label="Compartir caso" (click)="shareRequested.emit(post)">
      <ion-icon name="share-social-outline" aria-hidden="true"></ion-icon><span>Compartir</span>
    </button>
    <button class="information-action" type="button" (click)="informationRequested.emit(post)">
      <ion-icon name="information-circle" aria-hidden="true"></ion-icon><span>Tengo información</span>
    </button>
  </div>

  @if (post.update) {
    <aside class="case-update">
      <div class="update-heading"><ion-icon name="megaphone-outline" aria-hidden="true"></ion-icon><strong>Actualización del caso</strong><span>Hace 1 día</span></div>
      <p>{{ post.update }}</p>
    </aside>
  }
</article>
